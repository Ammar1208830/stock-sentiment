name: Project checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m sentiment_lab doctor
      - run: python -m sentiment_lab demo --out artifacts/ci-demo
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-modeling-core.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m sentiment_lab m2-demo --out artifacts/ci-m2-demo
